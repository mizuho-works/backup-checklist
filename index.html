:root{--bg:#f3f4f2;--fg:#1d2327;--muted:#5d6870;--card:#ffffff;--line:#d8dcd9;--ac:#1f6f8b;--acfg:#ffffff;--ok:#2d7a45;--okbg:#e3f1e7;--warn:#a65a12;

:root[data-theme="dark"]{--bg:#15191b;--fg:#e8ebea;--muted:#9aa5ab;--card:#1f2527;--line:#363e42;--ac:#59aacb;--acfg:#0f1719;--ok:#6fcb8a;--okbg:#1f3326;--warn:#e0a05a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.6;padding-block:8px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto}
h1{font-size:21px;margin:10px 0 2px;text-wrap:balance}
.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:14px}
.links a{color:var(--ac)}
.all{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.pct{font-variant-numeric:tabular-nums;font-size:14px;min-width:6.5em;text-align:right;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:0 0 auto;font:inherit;font-size:15px;font-weight:700;padding:9px 13px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tab small{display:block;font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected=true]{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
.tab[aria-selected=true] small{color:var(--acfg);opacity:.85}
details.g{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.g>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font-weight:700;font-size:16px}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.g:not([open])>summary::after{transform:rotate(-90deg)}
.cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;font-weight:400;color:var(--muted)}
details.g.done>summary .cnt{color:var(--ok);font-weight:700}
.rows{padding:0 8px 8px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.it:hover{background:var(--bg)}
.it input{position:absolute;opacity:0;pointer-events:none}
.box{flex:0 0 26px;height:26px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;margin-top:1px;background:var(--card)}
.it input:checked+.box{background:var(--ok);border-color:var(--ok)}
.it input:checked+.box::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it input:focus-visible+.box{outline:3px solid var(--ac);outline-offset:2px}
.it input:checked~.tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tx{min-width:0;overflow-wrap:anywhere}
.nt{margin:6px 10px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.nt.b{color:var(--fg);font-weight:700;margin-top:12px}
code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.88em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 4px}
a{color:var(--ac)}
.stat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:13px;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.stat.on{opacity:.92}
.foot{margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head><body>
